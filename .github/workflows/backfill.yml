name: Backfill history

# Manual only. Fetches past EDGAR filing dates with the same fetch + SEC verification as the daily
# run (scripts/daily_update.py) and commits the passing days to the `backfill` branch, NOT main,
# so the live site and the weekly email are untouched until the pages are ready for a longer history.
# Each month runs as its own job; two at a time to stay well inside SEC's fair-access limits.
on:
  workflow_dispatch:
    inputs:
      months:
        description: "Space separated jobs: a month YYYY-MM (every weekday), or comma-joined days YYYY-MM-DD,YYYY-MM-DD (retry withheld days)"
        required: true
      branch:
        description: "Branch that receives the data"
        required: false
        default: backfill

permissions:
  contents: write

concurrency:
  group: backfill
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      months: ${{ steps.m.outputs.months }}
    steps:
      - id: m
        env:
          IN_MONTHS: ${{ inputs.months }}
        run: |
          out="["
          for m in $IN_MONTHS; do
            [[ "$m" =~ ^20[0-9]{2}-(0[1-9]|1[0-2])$ || "$m" =~ ^(20[0-9]{2}-[01][0-9]-[0-3][0-9],?)+$ ]] || { echo "bad entry: $m"; exit 1; }
            out="$out\"$m\","
          done
          echo "months=${out%,}]" >> "$GITHUB_OUTPUT"

  fetch:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        month: ${{ fromJSON(needs.plan.outputs.months) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and verify every weekday of ${{ matrix.month }}
        env:
          MONTH: ${{ matrix.month }}
        run: |
          # same SEC contact as the daily workflow (kept in one place: daily.yml)
          SEC_UA=$(sed -n 's/^ *SEC_UA: *"\(.*\)"/\1/p' .github/workflows/daily.yml | head -1)
          [ -n "$SEC_UA" ] || { echo "SEC_UA not found in daily.yml"; exit 1; }
          dates=$(python3 - <<'EOF'
          import calendar, datetime as dt, os
          spec = os.environ["MONTH"]
          if len(spec) > 7:  # explicit days
              print(" ".join(x for x in spec.split(",") if x)); raise SystemExit
          y, m = map(int, spec.split("-"))
          print(" ".join(dt.date(y, m, d).isoformat() for d in range(1, calendar.monthrange(y, m)[1] + 1)
                         if dt.date(y, m, d).weekday() < 5))
          EOF
          )
          python3 scripts/daily_update.py --ua "$SEC_UA" --secs-per-date 600 --dates $dates
          echo "ADDED=$(tr '\n' ' ' < work/added.txt | xargs)" >> "$GITHUB_ENV"

      - name: Consistency check of the new days
        if: env.ADDED != ''
        run: python3 -I scripts/check_data.py | tail -5

      - name: Commit to ${{ inputs.branch }}
        if: env.ADDED != ''
        run: |
          git config user.name "insider-flow-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/days
          git commit -m "Backfill Form 4 data ${{ matrix.month }}: $(echo $ADDED | wc -w) days"
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin "${{ inputs.branch }}" && git push origin "HEAD:${{ inputs.branch }}" && exit 0
            sleep $((i * 7))
          done
          echo "could not push"; exit 1

      - name: Withheld days
        if: always()
        run: |
          if [ -f work/problems.md ]; then
            { echo "### Withheld or missing days (${{ matrix.month }})"; echo; cat work/problems.md; } >> "$GITHUB_STEP_SUMMARY"
            cat work/problems.md
          fi

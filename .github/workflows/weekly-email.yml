name: Weekly email draft

# Saturdays 15:35 UTC = 08:35 PDT / 07:35 PST. Creates a Buttondown DRAFT only; April reviews and sends it.
on:
  schedule:
    - cron: "35 15 * * 6"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build digest (Chinese first, English after)
        run: python3 -I scripts/weekly.py data/days --lang both --out week.json | head -3
      - name: Create Buttondown draft
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: |
          if [ -z "$BUTTONDOWN_API_KEY" ]; then echo "BUTTONDOWN_API_KEY secret not set"; exit 1; fi
          python3 -I scripts/bd_post.py week.json --status draft | tee out.txt
          grep -q "created draft" out.txt
          { echo "Draft created in Buttondown. Review and send it there."; echo; python3 -c "import json;w=json.load(open('week.json'));print(w['subject']);print(w['week_from'],'to',w['week_to'])"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Weekly email draft failed ($(date +%F))" --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

@font-face{font-family:'Figtree';font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/f2.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

/* Layout: one app column (max 640px) of stacked cards — hero net-flow card, sector flow list, ranked company list, daily chart; desktop widens to two columns below the hero */
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f5f7fa; --ink:#0e1726; --muted:#5d6879; --faint:#97a1b0; --line:#e1e6ed;
  --buy:#0f9d6e; --buy-soft:#dcf3ea; --sell:#e0483f; --sell-soft:#fbe3e1; --plan:#f0a39d;
  --accent:#2c49c9; --accent-soft:#e3e8fb;
  --hero:#0f1b2d; --hero-ink:#f4f7fb; --hero-muted:#9aa8bd; --hero-line:#22324a; --hero-band:rgba(255,255,255,.08); --hero-buy:#3ddc9b; --hero-sell:#ff7b72;
  --shadow:0 1px 2px rgba(14,23,38,.05),0 6px 20px rgba(14,23,38,.06);
  --display:"Bricolage Grotesque","Figtree","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --body:"Figtree","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
  --r:18px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b111b; --surface:#131c2a; --surface-2:#1a2535; --ink:#e8edf4; --muted:#9aa6b8; --faint:#6b778a; --line:#243146;
  --buy:#34d399; --buy-soft:#123a2d; --sell:#ff7b72; --sell-soft:#43201f; --plan:#8c4a45;
  --accent:#8ea6ff; --accent-soft:#1f2b4d;
  --hero:#16243a; --hero-ink:#f4f7fb; --hero-muted:#a3b0c4; --hero-line:#2a3b57; --hero-band:rgba(255,255,255,.09); --hero-buy:#3ddc9b; --hero-sell:#ff8a82;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b111b; --surface:#131c2a; --surface-2:#1a2535; --ink:#e8edf4; --muted:#9aa6b8; --faint:#6b778a; --line:#243146;
  --buy:#34d399; --buy-soft:#123a2d; --sell:#ff7b72; --sell-soft:#43201f; --plan:#8c4a45;
  --accent:#8ea6ff; --accent-soft:#1f2b4d;
  --hero:#16243a; --hero-ink:#f4f7fb; --hero-muted:#a3b0c4; --hero-line:#2a3b57; --hero-band:rgba(255,255,255,.09); --hero-buy:#3ddc9b; --hero-sell:#ff8a82;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
button{font:inherit;color:inherit}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:no-preference){.card,.row,.seg button,.chip,.tab{transition:background .15s,color .15s,border-color .15s,transform .15s}}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.topin{display:flex;align-items:center;gap:12px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.logo{width:30px;height:30px;border-radius:9px;background:var(--hero);display:grid;place-items:center;flex:none}
.brand b{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.01em;white-space:nowrap}
.brand b i{font-style:normal;color:var(--accent)}
.lang{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;flex:none}
.lang button{border:0;background:none;padding:5px 10px;border-radius:999px;font-size:13px;color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tabs{display:flex;gap:8px;padding-bottom:12px}
.tab{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
.tabs .tab{display:inline-flex;align-items:center;gap:8px;font-size:16px;font-weight:700;padding:10px 18px;border-radius:12px;color:var(--ink);background:var(--surface);border:1px solid var(--line)}
.tabs .tab svg{flex:none;opacity:.75}
.tabs .tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);box-shadow:var(--shadow)}
.tabs .tab[aria-pressed="true"] svg{opacity:1}
.tab[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

main{display:grid;gap:16px;padding-block:8px 0}
.grid{display:grid;gap:16px}
@media (min-width:900px){.grid.two{grid-template-columns:1fr 1fr;align-items:start}}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;min-width:0}
.card h2{font-family:var(--display);font-weight:700;font-size:19px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sub{color:var(--muted);font-size:13px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;padding:7px 12px;border-radius:10px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(14,23,38,.12)}
.scroller{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-18px;padding-inline:18px;padding-bottom:2px}
.scroller::-webkit-scrollbar{display:none}
@media (min-width:700px){.scroller.secchips{flex-wrap:wrap;overflow:visible;margin-inline:0;padding-inline:0}}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--ink)}
.chip small{color:var(--muted);margin-left:4px;font-size:12px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.7}

/* scope bar */
.scope{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.scope .seg{background:var(--surface);box-shadow:var(--shadow)}
.scope .seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
.scopehint{font-size:12.5px;color:var(--muted);flex:1 1 220px;min-width:0}

/* hero */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:20px;box-shadow:var(--shadow);display:grid;gap:16px;position:relative;overflow:hidden}
.hero .eyebrow{color:var(--hero-muted)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.big{font-family:var(--display);font-weight:700;font-size:clamp(40px,11vw,58px);line-height:1;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.big.pos{color:var(--hero-buy)} .big.neg{color:var(--hero-sell)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:600;background:rgba(255,255,255,.08);color:var(--hero-ink);white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%}
.hero-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--hero-line);border-radius:14px;overflow:hidden}
.hero-stats div{background:var(--hero);padding:10px 12px;display:grid;gap:2px;min-width:0}
.hero-stats span{font-size:12px;color:var(--hero-muted)}
.hero-stats b{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spark{display:block;width:100%;height:96px}
.hchart{display:grid;gap:6px}
.hcap{display:flex;justify-content:space-between;gap:8px 14px;flex-wrap:wrap;font-size:12px;color:var(--hero-muted)}
.hleg{display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap}.hleg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-left:8px}.hleg i:first-child{margin-left:0}
.hleg i.band{background:var(--hero-band);outline:1px solid var(--hero-line)}
.hplot{position:relative;padding-left:58px}
.hy{position:absolute;left:0;top:0;bottom:0;width:52px;font-size:11px;color:var(--hero-muted);font-variant-numeric:tabular-nums}
.hy span{position:absolute;right:0;top:0;transform:translateY(-2px);white-space:nowrap}.hy span:nth-child(2){transform:translateY(-50%)}.hy span.b{top:auto;bottom:0;transform:translateY(2px)}
.hnote{font-size:11px;color:var(--hero-muted);padding-left:58px}
.hx{display:flex;justify-content:space-between;padding-left:58px;font-size:11px;color:var(--hero-muted)}
.hero-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--hero-muted)}
.verified{display:inline-flex;align-items:center;gap:5px;color:var(--hero-buy);font-weight:600}

/* summary */
.summary{background:var(--surface-2);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.55}
.summary b{font-weight:700}
.pos{color:var(--buy)} .neg{color:var(--sell)} .zero{color:var(--faint)}

/* sector flow rows */
.flow{display:grid;gap:4px;margin-top:12px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 12px;padding:10px 8px;border-radius:12px;cursor:pointer;border:0;background:none;text-align:left;width:100%}
.row:hover{background:var(--surface-2)}
.row.sel{background:var(--accent-soft)}
#rank{scroll-margin-top:120px}
.rankhead{flex-wrap:wrap;gap:8px 10px}.rankhead h2{margin-right:auto}
.secpick{display:inline-flex;align-items:center;gap:4px}
.secpick select{font:inherit;font-size:13.5px;font-weight:600;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:6px 26px 6px 10px;cursor:pointer;appearance:none;-webkit-appearance:none;background-color:var(--surface);background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 13px) 52%,calc(100% - 8px) 52%;background-size:5px 5px;background-repeat:no-repeat;max-width:170px}
.secpick select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.secx{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px;cursor:pointer;border-radius:8px}.secx:hover{background:var(--accent-soft)}
.msp{display:inline-flex;align-items:center;width:84px;height:24px;align-self:center}
.swbox{margin:12px 0 6px;padding:12px 12px 8px;border:1px solid var(--line);border-radius:14px}
.swcap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted);margin-bottom:6px}
.swcap .hleg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin:0 4px 0 10px;vertical-align:-1px}
.swplot{position:relative;padding-left:58px}.swsvg{display:block;width:100%;height:110px}
.swy{position:absolute;left:0;top:0;bottom:0;width:54px;font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}.swy span{position:absolute;right:4px;top:0}.swy .b{top:auto;bottom:0}
.swx{padding-left:58px;color:var(--faint)}.swnote{margin-top:6px;font-size:12px}

.row .name{font-weight:600;font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .net{font-weight:700;font-size:15px;text-align:right;font-variant-numeric:tabular-nums}
.row .bar{grid-column:1/-1;display:block}
.row .meta{grid-column:1/-1;display:flex;gap:12px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.dbar{position:relative;display:block;height:10px;background:var(--surface-2);border-radius:5px;margin-block:2px}
.dbar i{position:absolute;top:0;height:10px;border-radius:5px}
.dbar .mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-top:10px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.quiet{font-size:12.5px;color:var(--muted);margin-top:8px}

/* ranked list */
.rank{display:grid;gap:2px;margin-top:10px}
.co{display:grid;grid-template-columns:22px 58px minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 6px;border-radius:12px;border:0;background:none;text-align:left;width:100%;cursor:pointer}
.co:hover{background:var(--surface-2)}
.co .n{color:var(--faint);font-size:13px;text-align:center;font-variant-numeric:tabular-nums}
.tk{font-weight:700;font-size:12.5px;letter-spacing:.02em;background:var(--surface-2);border-radius:8px;padding:5px 0;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.co .who{min-width:0}
.co .who b{display:block;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.co .who span{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.co .amt{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;font-size:14.5px}
.co .amt small{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:14px}

/* chart */
.chart svg{display:block;width:100%;height:auto}

/* search */
.searchbox{display:flex;gap:8px}
.searchbox input{flex:1;min-width:0;font:inherit;font-size:16px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink)}
.searchbox button{border:0;background:var(--ink);color:var(--bg);border-radius:14px;padding:0 18px;font-weight:700;cursor:pointer}
.qwrap{position:relative;flex:1;min-width:0;display:flex}.qwrap input{padding-right:44px}
.qwrap input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none;display:none}
.searchbox .qclear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;padding:0;border-radius:999px;background:transparent;color:var(--muted);font-size:20px;line-height:1;font-weight:400;display:none;align-items:center;justify-content:center}
.searchbox .qclear:hover{background:var(--line);color:var(--ink)}.qwrap.has-q .qclear{display:flex}
.hist{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}.hist .eyebrow{margin-right:2px}
.hist .linkbtn{border:0;background:none;color:var(--muted);font:inherit;font-size:12px;text-decoration:underline;cursor:pointer;padding:4px}
.matches{display:grid;gap:4px;margin-top:10px}
.cohead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cohead .tk{font-size:16px;padding:6px 10px}
.cohead h2{flex:1 1 200px}
.tag{display:inline-block;font-size:11.5px;font-weight:600;border-radius:6px;padding:2px 7px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.links{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px;margin-top:8px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.tile{background:var(--surface-2);border-radius:14px;padding:10px 12px;min-width:0}
.tile span{display:block;font-size:12px;color:var(--muted)}
.tile b{display:block;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:420px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.list{display:grid;gap:8px;margin-top:10px}
.item{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:6px}
.item .l1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.item .l1 b{font-weight:600;min-width:0;overflow-wrap:anywhere}
.item .l2{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.item .l3{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.badge{font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 7px;white-space:nowrap}
.b-buy{background:var(--buy-soft);color:var(--buy)} .b-sell{background:var(--sell-soft);color:var(--sell)}
.b-mute{background:var(--surface-2);color:var(--muted);font-weight:600}
.b-eff{background:var(--accent-soft);color:var(--accent)}
.b-hold{background:var(--buy-soft);color:var(--buy)}
.sgrid{display:grid;gap:16px}
.sumacts{display:inline-flex;align-items:center;gap:10px}
.smodal{position:fixed;inset:0;z-index:80;background:rgba(5,10,20,.66);display:grid;place-items:center;padding:16px}
.smodal[hidden]{display:none}
.sbox{background:var(--surface);border-radius:18px;padding:14px;max-width:min(440px,100%);max-height:calc(100vh - 32px);overflow:auto;display:grid;gap:10px;text-align:center}

  notes:[["怎么读","日期指申报提交到 SEC 的日期，交易本身通常早几天。默认只看信号最强的交易（有效买卖）：高管、董事的公开市场买卖，已排除计划内交易、IPO/认购、行权卖出等；可在“统计口径”里切换为全部高管董事或所有内部人。"],["图表","柱子比例按所选时间设定，特别高的柱子会被截断，白线为截断标记。"],["本期要点","根据数据自动生成，不是人工评论，也不构成投资建议。"],["数据来源","SEC EDGAR 每日 Form 4 索引，按提交日归档。只计原始 Form 4（不含 4/A 修正）中非衍生品表的公开市场买入 (P) 和卖出 (S)，金额 = 股数 × 每股价格。期权授予、行权、RSU 归属、赠与、税务代扣不计入。Form 144（拟出售）不在 Form 4 中，也不计入。"],["外币价格","少数外国发行人（如 ASE/ASX 用新台币）在 Form 4 里以本地货币填写每股价格，只在脚注说明。凡价格脚注表明是外币的交易，按交易日汇率换算为美元后再计入，并标注“外币已换算为美元”；无法取得汇率的交易不计入合计。"],
   ["有效买卖","有效买入 = 高管或董事的公开市场买入，排除 10b5-1 计划内买入、IPO/增发/私募/单位认购、SPAC、股息再投资/员工购股/基金申购，以及基金、信托和非上市标的。有效卖出 = 高管或董事的公开市场卖出，排除 10b5-1 计划内卖出、期权行权当天的卖出和缴税卖出。被排除的交易在“全部内部人”和个股查询中仍可看到，带标签。"],
   ["去重","同一笔交易由关联申报人（基金、普通合伙人、代表基金的董事等）分别申报时只计一次：同一发行人、类型、日期、股数和价格视为同一笔。"],
   ["板块","按发行人 SIC 行业代码映射到 11 个板块，与 secform4 的分类相近但不完全相同。没有 SIC 代码的基金、信托归入“未分类”。"],
   ["数据核验","每天对有效买卖前 10 名背后的每份申报，加上随机抽取的申报，用另一套程序从 SEC 官方 Form 4 页面重新读取，逐股逐美元核对，并核对申报→公司→板块的合计。全部通过才发布；未通过的日期暂不发布并自动重试。"],
   ["集群买入与持股变化","集群买入：近 30 天内至少 2 位不同的高管或董事有效买入同一家公司（同一人多次买入只算一位；关联方联合申报按第一申报人计）。持股变化 = 本次买入股数 ÷ 买入前持有的同类股份（直接与间接持股合计，取自 Form 4 的“交易后持有数量”）；买入前为 0 显示为“新建仓”。选了时间范围时，只列出这段时间内又有新买入的集群，人数仍按近 30 天计算。"],["异常值","单笔超过 10 亿美元或每股超过 1 万美元的交易，申报价格明显超出其脚注所写成交价区间的交易，以及经人工核实为填写错误的个别申报，都不计入合计，单独列出。每天另有自动检查，发现可疑数字（如价格与该股以往价格相差数倍、脚注提到外币但未换算）会提醒人工复核。"]]},

    flags:"<b>有效</b>：計入「有效買賣」的交易。<br><b>10b5-1 計劃</b>：事先設定好的自動交易計劃，不代表當下的判斷。<br><b>行權後賣出</b>：行使期權當天賣出，多為把報酬變現。<br><b>繳稅賣出</b>：為繳納股票報酬的稅款而賣出。<br><b>IPO/認購</b>：參與發行或私募，不是在公開市場買入。<br><b>遲報 >30 天</b>：交易日和申報日相隔 30 天以上。",

  notes:[["怎麼讀","日期指申報提交到 SEC 的日期，交易本身通常早幾天。預設只看訊號最強的交易（有效買賣）：高管、董事的公開市場買賣，已排除計劃內交易、IPO/認購、行權賣出等；可在“統計口徑”裡切換為全部高管董事或所有內部人。"],["圖表","柱子比例按所選時間設定，特別高的柱子會被截斷，白線為截斷標記。"],["本期要點","根據資料自動生成，不是人工評論，也不構成投資建議。"],["資料來源","SEC EDGAR 每日 Form 4 索引，按提交日歸檔。只計原始 Form 4（不含 4/A 修正）中非衍生品表的公開市場買入 (P) 和賣出 (S)，金額 = 股數 × 每股價格。期權授予、行權、RSU 歸屬、贈與、稅務代扣不計入。Form 144（擬出售）不在 Form 4 中，也不計入。"],["外幣價格","少數外國發行人（如 ASE/ASX 用新臺幣）在 Form 4 裡以本地貨幣填寫每股價格，只在腳註說明。凡價格腳註表明是外幣的交易，按交易日匯率換算為美元后再計入，並標註“外幣已換算為美元”；無法取得匯率的交易不計入合計。"],
   ["有效買賣","有效買入 = 高管或董事的公開市場買入，排除 10b5-1 計劃內買入、IPO/增發/私募/單位認購、SPAC、股息再投資/員工購股/基金申購，以及基金、信託和非上市標的。有效賣出 = 高管或董事的公開市場賣出，排除 10b5-1 計劃內賣出、期權行權當天的賣出和繳稅賣出。被排除的交易在“全部內部人”和個股查詢中仍可看到，帶標籤。"],
   ["去重","同一筆交易由關聯申報人（基金、普通合夥人、代表基金的董事等）分別申報時只計一次：同一發行人、型別、日期、股數和價格視為同一筆。"],
   ["板塊","按發行人 SIC 行業程式碼對映到 11 個板塊，與 secform4 的分類相近但不完全相同。沒有 SIC 程式碼的基金、信託歸入“未分類”。"],
   ["資料核驗","每天對有效買賣前 10 名背後的每份申報，加上隨機抽取的申報，用另一套程式從 SEC 官方 Form 4 頁面重新讀取，逐股逐美元核對，並核對申報→公司→板塊的合計。全部通過才釋出；未通過的日期暫不釋出並自動重試。"],
   ["集群買入與持股變化","集群買入：近 30 天內至少 2 位不同的高管或董事有效買入同一家公司（同一人多次買入只算一位；關聯方聯合申報按第一申報人計）。持股變化 = 本次買入股數 ÷ 買入前持有的同類股份（直接與間接持股合計，取自 Form 4 的“交易後持有數量”）；買入前為 0 顯示為“新建倉”。選了時間範圍時，只列出這段時間內又有新買入的集群，人數仍按近 30 天計算。"],["異常值","單筆超過 10 億美元或每股超過 1 萬美元的交易，申報價格明顯超出其腳註所寫成交價區間的交易，以及經人工核實為填寫錯誤的個別申報，都不計入合計，單獨列出。每天另有自動檢查，發現可疑數字（如價格與該股以往價格相差數倍、腳註提到外幣但未換算）會提醒人工複核。"]]},

function topBuy(set,key){let best=null;for(const d of set)for(const c of d.companies||[]){if(coKey(c)!==key)continue;
  for(const f of c.filings||[])if(f.eff_buy>0&&(!best||f.eff_buy>best.eff_buy))best=f}return best}

/* ---------- overview ---------- */
function hero(days,r,prev){const t=L();
  const cur=tot(aggregate(r.set)),pv=prev?tot(aggregate(prev.set)):null,net=cur.buy-cur.sell;
  const pct=(x,y)=>y?(x/y-1)*100:null,f=v=>v==null?"—":(v>=0?"+":"")+v.toFixed(0)+"%";
  const all=[...days].sort((a,b)=>a.date<b.date?-1:1),inWin=new Set(r.set.map(d=>d.date));
  const full=r.set.length>=20;
  const ds=(full?all.filter(d=>inWin.has(d.date)):all.filter(d=>d.date<=r.to).slice(-20)).map(d=>{const x=tot(aggregate([d]));return{date:d.date,net:x.buy-x.sell}});
  // scale to the selected period so its bars stay readable; taller context bars are clipped (marked)
  const absAll=ds.map(v=>Math.abs(v.net)).sort((a,b)=>a-b),q=absAll[Math.floor(absAll.length*0.6)]||0;
  const winAbs=Math.max(0,...ds.filter(v=>full||inWin.has(v.date)).map(v=>Math.abs(v.net)));
  const cap=Math.max(winAbs*1.15,q,1);
  const pmax=Math.min(cap,Math.max(0,...ds.map(v=>v.net))),nmax=Math.min(cap,Math.max(0,...ds.map(v=>-v.net))),span=Math.max(1,pmax+nmax);
  let clipped=false;
  const W=600,H=96,bw=W/Math.max(1,ds.length),zero=pmax+nmax>0?H*pmax/span:H/2;
  let sp="";const wi=ds.map((v,i)=>inWin.has(v.date)?i:-1).filter(i=>i>=0);
  if(!full&&wi.length)sp+=`<rect x="${(wi[0]*bw).toFixed(1)}" y="0" width="${((wi[wi.length-1]-wi[0]+1)*bw).toFixed(1)}" height="${H}" rx="6" fill="var(--hero-band)"/>`;
  ds.forEach((v,i)=>{const lim=v.net>=0?pmax:nmax,cl=Math.abs(v.net)>lim+1e-6,h=Math.max(1.5,Math.min(Math.abs(v.net),lim)/span*(H-4)),x=i*bw+bw*.2,y=v.net>=0?zero-h:zero;
    if(cl){clipped=true;const ey=v.net>=0?y:y+h;sp+=`<line x1="${(x-1).toFixed(1)}" x2="${(x+bw*.6+1).toFixed(1)}" y1="${(v.net>=0?ey+3:ey-3).toFixed(1)}" y2="${(v.net>=0?ey+3:ey-3).toFixed(1)}" stroke="var(--hero-ink)" stroke-width="2" opacity=".85"/>`}
    sp+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*.6).toFixed(1)}" height="${h.toFixed(1)}" rx="1.5" fill="${v.net>=0?"var(--hero-buy)":"var(--hero-sell)"}" opacity="${full||inWin.has(v.date)?1:.38}"><title>${md(v.date)} ${wk(v.date)} · ${t.netWord} ${money(v.net,true)}</title></rect>`});
  sp+=`<line x1="0" x2="${W}" y1="${zero.toFixed(1)}" y2="${zero.toFixed(1)}" stroke="var(--hero-line)" stroke-width="1.5"/>`;
  const mid=ds[Math.floor((ds.length-1)/2)];
  const spark=`<div class="hchart"><div class="hcap"><span>${t.hcTitle(ds.length)}${state.win==="1d"?` · ${t.hcDay(md(r.to),money(net,true))}`:""}</span><span class="hleg"><i style="background:var(--hero-buy)"></i>${t.hcBuy}<i style="background:var(--hero-sell)"></i>${t.hcSell}${full?"":`<i class="band"></i>${t.hcSel}`}</span></div>
    <div class="hplot"><div class="hy"><span>${pmax?money(pmax,true):""}</span><span style="top:${(zero/H*100).toFixed(1)}%">0</span><span class="b">${nmax?money(-nmax,true):""}</span></div>
    <svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(t.hcTitle(ds.length))}">${sp}</svg></div>
    <div class="hx"><span>${md(ds[0].date)}</span><span>${ds.length>4?md(mid.date):""}</span><span>${md(ds[ds.length-1].date)}</span></div></div>`;
  const ratio=cur.sell?(cur.buy/cur.sell).toFixed(2):"—";
  return `<section class="hero" aria-label="${esc(t.heroLabel[state.who])}">
    <div class="hero-top"><div><div class="eyebrow">${t.winLbl[state.win]} · ${t.heroNet[state.who]}</div>
      <div class="big ${net>0?"pos":net<0?"neg":""}">${money(net,true)}</div></div>
      <span class="pill"><span class="dot" style="background:${net>=0?"var(--hero-buy)":"var(--hero-sell)"}"></span>${t.days(r.set.length)}</span></div>
    <div class="hero-stats"><div><span>${t.bought}</span><b style="color:var(--hero-buy)">${money(cur.buy)}</b></div>
      <div><span>${t.sold}</span><b style="color:var(--hero-sell)">${money(cur.sell)}</b></div>
      <div><span>${t.ratio}</span><b>${ratio}</b></div></div>
    ${spark}
    <div class="hero-foot"><span>${pv?t.vsPrevW(t.prevUnit[state.win],f(pct(cur.buy,pv.buy)),f(pct(cur.sell,pv.sell))):t.noPrev}</span>
      </div>
  </section>`}

function summaryCard(days,r,prev){const t=L();
  const rows=aggregate(r.set),cur=tot(rows),pv=prev?tot(aggregate(prev.set)):null;
  const act=rows.filter(x=>x.buy||x.sell).sort((a,b)=>(b.buy-b.sell)-(a.buy-a.sell));
  const topS=act[0]&&act[0].buy-act[0].sell>0?act[0]:null,botS=act.length&&act[act.length-1].buy-act[act.length-1].sell<0?act[act.length-1]:null;
  const cs=companies(r.set,null),buyers=cs.filter(c=>c.eb-c.es>0).sort((a,b)=>(b.eb-b.es)-(a.eb-a.es)),sellers=cs.filter(c=>c.es-c.eb>0).sort((a,b)=>(b.es-b.eb)-(a.es-a.eb));
  const cw=clusterWin(days,r),cl=clusters(days,cw.from,cw.to).filter(c=>!c.program&&(!cw.ext||c.last>=r.from));
  const tk=c=>`<button type="button" class="tkc" data-co="${esc(c.key)}">${esc(c.ticker||c.name)}</button>`;
  const chg=(x,y)=>{if(!pv||!y)return"";const v=Math.round((x/y-1)*100);return ` <span class="chg">${v>=0?"▲":"▼"}${Math.abs(v)}%</span>`};
  // headline: which side dominates
  const b=cur.buy,s_=cur.sell;let head;
  if(!b&&!s_)head=`<span class="zero">${t.hNone}</span>`;
  else if(b>=s_)head=s_?t.hBuy(`<b class="pos">${(b/s_).toFixed(1)}</b>`):t.hOnlyBuy;
  else head=b?t.hSell(`<b class="neg">${(s_/b).toFixed(1)}</b>`):t.hOnlySell;
  const row=(lab,html)=>`<div class="srow"><span class="slab">${lab}</span><div class="sval">${html}</div></div>`;
  const out=[];
  if(topS||botS)out.push(row(t.lSec,[topS?`<button type="button" class="spill up" data-gosec="${esc(topS.sector)}">▲ ${esc(SN(topS.sector))} ${money(topS.buy-topS.sell,true)}</button>`:"",botS?`<button type="button" class="spill dn" data-gosec="${esc(botS.sector)}">▼ ${esc(SN(botS.sector))} ${money(botS.buy-botS.sell,true)}</button>`:""].join("")));
  if(buyers[0]){const c=buyers[0],f=topBuy(r.set,c.key),hp=f?holdPct(f):null;
    out.push(row(t.lBuy,`${tk(c)} <span class="nm">${esc(c.name)}</span> <b class="pos">${money(c.eb-c.es,true)}</b>
      ${f?`<div class="det">${pBtn(firstOwner(f).name)}${hp!=null?` <span class="badge b-hold">${holdTxt(t,hp)}</span>`:""}</div>`:""}
`))}
  else out.push(row(t.lBuy,`<span class="zero">${t.sumNoBuy}</span>`));
  if(sellers[0]){const c=sellers[0];out.push(row(t.lSell,`${tk(c)} <span class="nm">${esc(c.name)}</span> <b class="neg">${money(c.eb-c.es,true)}</b>${sellers.length>1?`<div class="det">${t.next} ${sellers.slice(1,4).map(tk).join(" ")}</div>`:""}`))}
  const tb0=buyers[0]?topBuy(r.set,buyers[0].key):null,hp0=tb0?holdPct(tb0):null;
  SHARE={win:t.winLbl[state.win],range:state.win==="1d"?t.dayLine(md(r.to),wk(r.to)):t.rangeShort(md(r.set.map(d=>d.date).sort()[0]||r.from),md(r.to),r.set.length),
    label:t.heroNet[state.who],buy:b,sell:s_,date:r.to,
    up:topS?[SN(topS.sector),money(topS.buy-topS.sell,true)]:null,dn:botS?[SN(botS.sector),money(botS.buy-botS.sell,true)]:null,
    tb:buyers[0]?{tk:buyers[0].ticker||"",nm:buyers[0].name,amt:money(buyers[0].eb-buyers[0].es,true),who:tb0?firstOwner(tb0).name:"",hold:hp0!=null?holdTxt(t,hp0):""}:null,
    ts:sellers[0]?{tk:sellers[0].ticker||"",nm:sellers[0].name,amt:money(sellers[0].eb-sellers[0].es,true)}:null};
  return `<section class="card sumcard"><div class="head" style="margin-bottom:6px"><h2>${t.sumTitle}</h2><span class="sumacts"><button type="button" class="tgl" id="sharebtn">${t.shareImg}</button></span></div>
    <div class="srows">${out.join("")}</div></section>`}

function rankList(t,list,key,clMap){return list.map((c,i)=>{const net=c.eb-c.es,who=[...(key==="buy"?c.buyers:c.sellers)].map(shortWho).slice(0,2).join("、");
    const cb=key==="buy"&&clMap.has(c.key)?`<i class="badge b-eff cb">${t.clBadge(clMap.get(c.key))}</i>`:"";

/* ---------- weekly sector trend (precomputed in manifest.sw) ---------- */
const swData=()=>MANIFEST&&MANIFEST.sw&&MANIFEST.sw.weeks?MANIFEST.sw:null;
function swRows(sec){const sw=swData();if(!sw)return null;const by=sw.S[sec];if(!by)return null;const a=by[state.who]||by.eff;return a?a.map((x,i)=>({w:sw.weeks[i],buy:x[0],sell:x[1],net:x[0]-x[1],tk:x[2]||"",tn:x[3]||0})):null}
function swInWin(w,r){return w<=r.to&&addDays(w,6)>=r.from}
function miniSpark(sec,r){const a=swRows(sec);if(!a||!a.some(x=>x.net))return `<span class="msp"></span>`;
  const W=84,H=24,sq=v=>Math.sqrt(Math.abs(v)),mx=Math.max(1,...a.map(x=>sq(x.net))),bw=W/a.length,z=H/2;let g="";
  a.forEach((x,i)=>{if(!x.net)return;const h=Math.max(1.5,sq(x.net)/mx*(z-1));g+=`<rect x="${(i*bw+bw*.15).toFixed(1)}" y="${(x.net>0?z-h:z).toFixed(1)}" width="${(bw*.7).toFixed(1)}" height="${h.toFixed(1)}" rx=".8" fill="var(${x.net>0?"--buy":"--sell"})" opacity="${swInWin(x.w,r)?1:.55}"/>`});
  return `<span class="msp" title="${esc(L().swMini(a.length))}"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true"><line x1="0" x2="${W}" y1="${z}" y2="${z}" stroke="var(--line)" stroke-width="1"/>${g}</svg></span>`}
function secTrend(sec,r){const t=L(),a=swRows(sec);if(!a||!a.some(x=>x.net))return "";
  const W=600,H=110,mx=Math.max(1,...a.map(x=>Math.max(0,x.net))),mn=Math.max(0,...a.map(x=>Math.max(0,-x.net))),span=Math.max(1,mx+mn),z=(H-4)*mx/span+2,bw=W/a.length;
  let g="";const wi=a.map((x,i)=>swInWin(x.w,r)?i:-1).filter(i=>i>=0);
  if(wi.length&&wi.length<a.length)g+=`<rect x="${(wi[0]*bw).toFixed(1)}" y="0" width="${((wi[wi.length-1]-wi[0]+1)*bw).toFixed(1)}" height="${H}" rx="6" fill="var(--accent-soft)"/>`;
  a.forEach((x,i)=>{const h=Math.max(x.net?1.5:0,Math.abs(x.net)/span*(H-4));const tip=t.swTip(md(x.w),md(addDays(x.w,6)),money(x.net,true),money(x.buy),money(x.sell),x.tk&&x.tn?`${x.tk} ${money(x.tn,true)}`:"");
    g+=`<rect x="${(i*bw).toFixed(1)}" y="0" width="${bw.toFixed(1)}" height="${H}" fill="transparent"><title>${esc(tip)}</title></rect>`;
    if(h)g+=`<rect x="${(i*bw+bw*.2).toFixed(1)}" y="${(x.net>0?z-h:z).toFixed(1)}" width="${(bw*.6).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="var(${x.net>0?"--buy":"--sell"})" pointer-events="none"><title>${esc(tip)}</title></rect>`});
  g+=`<line x1="0" x2="${W}" y1="${z.toFixed(1)}" y2="${z.toFixed(1)}" stroke="var(--line)" stroke-width="1.5"/>`;
  const last=a[a.length-1],mid=a[Math.floor((a.length-1)/2)];
  const big=[...a].filter(x=>x.tk&&x.tn&&Math.abs(x.net)>0).sort((p,q)=>Math.abs(q.net)-Math.abs(p.net))[0];
  const dom=big&&Math.abs(big.tn)>=Math.abs(big.net)*0.7?`<div class="sub swnote">${t.swDom(md(big.w),big.tk)}</div>`:"";
  return `<div class="swbox"><div class="swcap"><span>${t.swTitle(a.length)}</span><span class="hleg"><i style="background:var(--buy)"></i>${t.hcBuy}<i style="background:var(--sell)"></i>${t.hcSell}<i class="band" style="background:var(--accent-soft)"></i>${t.hcSel}</span></div>
    <div class="swplot"><div class="swy"><span>${mx>1?money(mx,true):""}</span><span class="b">${mn?money(-mn,true):""}</span></div><svg class="swsvg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(t.swTitle(a.length))}">${g}</svg></div>
    <div class="hx swx"><span>${md(a[0].w)}</span><span>${md(mid.w)}</span><span>${md(last.w)}</span></div>${dom}</div>`}
function rankCard(days,r,withChips){const t=L(),cs=companies(r.set,state.sector),cw=clusterWin(days,r);
  const clMap=new Map(clusters(days,cw.from,cw.to).filter(c=>!c.program).map(c=>[c.key,c.people.size]));
  const list=state.rank==="buy"?cs.filter(c=>c.eb-c.es>0).sort((a,b)=>(b.eb-b.es)-(a.eb-a.es)).slice(0,10)

function chartCard(days,r){const t=L();

  const ds=src.map(d=>{const x=tot(aggregate([d]));return{date:d.date,buy:x.buy,sell:x.sell}});
  const mx=Math.max(1,...ds.map(v=>Math.max(v.buy,v.sell)));
  const step=[1,2,2.5,5,10];let mag=Math.pow(10,Math.floor(Math.log10(mx/2))),tick=mag;for(const s of step){if(mx/(s*mag)<=2.2){tick=s*mag;break}}
  const top=Math.ceil(mx/tick)*tick;
  const W=Math.max(320,Math.min(1100,(app.clientWidth||680)-36)),H=W<500?220:280,L0=56,R=8,T0=10,B=30,mid=T0+(H-T0-B)/2,half=(H-T0-B)/2,cw=(W-L0-R)/ds.length,bw=Math.min(18,cw*.6);
  const y=v=>mid-v/top*half;let g="";const every=Math.max(1,Math.ceil(ds.length/Math.max(4,Math.floor(W/95))));
  for(let v=-top;v<=top+1e-6;v+=tick){g+=`<line x1="${L0}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${v===0?'stroke-width="1.5"':""}/><text x="${L0-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${money(Math.abs(v))}</text>`}
  ds.forEach((v,i)=>{const cx=L0+cw*i+cw/2,op=inWin.has(v.date)?1:.35;
    g+=`<rect x="${cx-bw/2}" y="${y(v.buy)}" width="${bw}" height="${Math.max(0,mid-y(v.buy))}" rx="2" fill="var(--buy)" opacity="${op}"><title>${v.date} ${t.legendBuy} ${money(v.buy)}</title></rect>`;
    g+=`<rect x="${cx-bw/2}" y="${mid}" width="${bw}" height="${Math.max(0,y(-v.sell)-mid)}" rx="2" fill="var(--sell)" opacity="${op}"><title>${v.date} ${t.legendSell} ${money(v.sell)}</title></rect>`;
    if((ds.length-1-i)%every===0)g+=`<text x="${cx}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--muted)">${md(v.date)}</text>`});
  const tt=tot(aggregate(src));
  return `<section class="card chart"><div class="head"><h2>${t.chartTitle}</h2><span class="sub">${t.trendSub(md(ds[0].date),md(ds[ds.length-1].date),ds.length)}</span></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t.chartTitle)}">${g}</svg>
    <div class="legend"><span><i class="sw" style="background:var(--buy)"></i>${t.legendBuy} ↑</span><span><i class="sw" style="background:var(--sell)"></i>${t.legendSell} ↓</span><span>${esc(t["who"+state.who[0].toUpperCase()+state.who.slice(1)])}</span>${r.set.length<15?`<span>${t.trendDim}</span>`:""}</div>
    <div class="tiles" style="margin-top:12px"><div class="tile"><span>${t.bought}</span><b class="pos">${money(tt.buy)}</b></div><div class="tile"><span>${t.sold}</span><b class="neg">${money(tt.sell)}</b></div><div class="tile"><span>${t.tNet}</span><b class="${cls(tt.buy-tt.sell)}">${money(tt.buy-tt.sell,true)}</b></div></div></section>`}

function insPlot(t,pts){
  if(!pts.length)return `<h3>${t.plotT}</h3><div class="sub" style="margin-top:6px">${t.plotNone}</div>`;
  const box=$("chartcard"),cw=box&&box.clientWidth?box.clientWidth-40:560;
  const W=Math.max(300,Math.min(640,cw)),H=W<480?170:190,L0=50,R=10,T0=10,B=24,ds=pts.map(p=>p.date).sort();
  let d0=ds[0],d1=ds[ds.length-1];if(d0===d1){d0=addDays(d0,-15);d1=addDays(d1,15)}
  const tm=d=>Date.parse(d+"T12:00:00Z"),x0=tm(d0),x1=tm(d1),pad=(x1-x0)*0.04;
  const X=d=>L0+(tm(d)-x0+pad)/(x1-x0+2*pad)*(W-L0-R);
  const ps=pts.map(p=>p.px),lo=Math.min(...ps),hi=Math.max(...ps),log=lo>0&&hi/lo>4;
  const f=v=>log?Math.log(v):v,ylo=f(lo)-(f(hi)-f(lo)||Math.abs(f(lo))*0.1||1)*0.12,yhi=f(hi)+(f(hi)-f(lo)||Math.abs(f(hi))*0.1||1)*0.12;
  const Y=v=>T0+(1-(f(v)-ylo)/(yhi-ylo))*(H-T0-B);
  const fp=v=>v>=1000?"$"+Math.round(v).toLocaleString("en-US"):v>=1?"$"+v.toFixed(2):"$"+v.toPrecision(2);
  let g="";
  const vlo=log?Math.exp(ylo):ylo,vhi=log?Math.exp(yhi):yhi;let ticks=[];
  if(log){for(let k=Math.floor(Math.log10(vlo))-1;k<=Math.ceil(Math.log10(vhi));k++)for(const m of [1,2,5]){const v=m*Math.pow(10,k);if(v>=vlo&&v<=vhi)ticks.push(v)}
    if(ticks.length>5)ticks=ticks.filter(v=>Math.abs(Math.log10(v)%1)<1e-9||Math.abs(Math.log10(v)%1-1)<1e-9)}
  if(ticks.length<2){const r=vhi-vlo,raw=r/3,mg=Math.pow(10,Math.floor(Math.log10(raw)));let st=mg;for(const m of [1,2,2.5,5,10])if(raw<=m*mg){st=m*mg;break}
    for(let k=0;k<4;k++){ticks=[];for(let v=Math.ceil(vlo/st)*st;v<=vhi+1e-9;v+=st)ticks.push(+v.toPrecision(10));if(ticks.length>=3)break;st/=2}}
  const ft=v=>"$"+(+v.toPrecision(4)).toLocaleString("en-US");
  for(const v of ticks){const y=Y(v);
    g+=`<line x1="${L0}" x2="${W-R}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)"/><text x="${L0-6}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted)">${ft(v)}</text>`}
  const span=(x1-x0)/864e5,nx=Math.max(2,Math.floor((W-L0-R)/90)),step=Math.max(1,Math.ceil(span/nx));
  for(let d=d0,i=0;d<=d1&&i<12;d=addDays(d,step),i++)g+=`<text x="${X(d).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--muted)">${md(d)}</text>`;
  const mx=Math.max(...pts.map(p=>p.usd));
  [...pts].sort((a,b)=>b.usd-a.usd).forEach(p=>{const r=3+Math.sqrt(p.usd/mx)*8,c=p.k==="P"?"var(--buy)":"var(--sell)";
    g+=`<circle class="pt" cx="${X(p.date).toFixed(1)}" cy="${Y(p.px).toFixed(1)}" r="${r.toFixed(1)}" fill="${p.eff?c:"var(--surface)"}" fill-opacity="${p.eff?0.85:1}" stroke="${c}" stroke-width="1.6"><title>${esc(p.date+" · "+p.who+" · "+(p.k==="P"?t.buyB:t.sellB)+" "+Number(p.sh).toLocaleString("en-US")+" @ "+fp(p.px)+" · "+money(p.usd))}</title></circle>`});
  return `<h3>${t.plotT}</h3><div class="sub" style="margin-top:4px">${t.plotSub}</div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t.plotT)}">${g}</svg>
    <div class="legend"><span><i class="sw" style="background:var(--buy)"></i>${t.plotEffB}</span><span><i class="sw" style="background:var(--sell)"></i>${t.plotEffS}</span><span>${t.plotOther}</span></div>`}

// "NAME (roles)" joined by "; " -- the stored text is cut at 160 chars, so a last "(roles" may lack its ")"
const owners=w=>String(w||"").split("; ").map(s=>{const m=/^(.*?)\s*\((.*?)\)?\s*$/.exec(s);return m?{name:m[1].trim(),roles:m[2].trim()}:{name:s.trim(),roles:""}}).filter(o=>o.name);
const pkey=n=>String(n||"").trim().toUpperCase();
const rolesOf=f=>owners(f.who).map(o=>o.roles).join(", ");
const isCeoCfo=r=>/chief executive|chief financial|\bceo\b|\bcfo\b/i.test(r);
const isDir=r=>/director/i.test(r);
function roleOk(f){if(state.role==="all")return true;const r=rolesOf(f);return state.role==="cx"?isCeoCfo(r):isDir(r)}
const pBtn=name=>`<span class="pn" role="link" tabindex="0" data-person="${esc(pkey(name))}">${esc(name)}</span>`;

const qm=k=>`<button type="button" class="qm" data-tip="${k}" aria-label="${esc(L().tipAria)}">?</button>`;

function filingsIn(set){const out=[];for(const d of set)for(const c of d.companies||[])for(const f of c.filings||[])out.push({c,f,date:d.date});return out}

    arr=arr.filter(x=>v144(x)>=amt&&(state.role==="all"||(state.role==="dir"?(x.rel||[]).some(v=>/director/i.test(v)):(x.rel||[]).some(v=>/officer/i.test(v)))));

  else if(state.list==="net"||state.list==="sell"){
    const m={},lim=Math.max(amt,1);
    for(const {c,f} of fs){const eb=(f.eff_buy||0)>=lim?f.eff_buy:0,es=(f.eff_sell||0)>=lim?f.eff_sell:0;if(!eb&&!es)continue;
      const k=coKey(c),e=m[k]||(m[k]={c,eb:0,es:0,n:0,people:new Map()});e.eb+=eb;e.es+=es;e.n++;const o=firstOwner(f);e.people.set(o.name,(e.people.get(o.name)||0)+eb+es)}
    let arr=Object.values(m);
    arr=state.list==="net"?arr.filter(e=>e.eb-e.es>0).sort((a,b)=>(b.eb-b.es)-(a.eb-a.es)):arr.filter(e=>e.es-e.eb>0).sort((a,b)=>(b.es-b.eb)-(a.es-a.eb));
    rows=arr.slice(0,15).map((e,i)=>{const net=e.eb-e.es,ps=[...e.people.entries()].sort((a,b)=>b[1]-a[1]).slice(0,2).map(([n])=>pBtn(n)).join("、");
      return `<div class="lrow"><span class="n">${i+1}</span>${tk(e.c)}<span class="who"><b>${esc(e.c.name)}</b><span><i class="stag">${esc(SN(e.c.sector))}</i>${ps}</span></span><span class="amt ${cls(net)}">${money(net,true)}<small>${t.filings(e.n)}</small></span></div>`})}
  else{
    let arr=fs.filter(x=>x.f.eff_buy>0&&x.f.eff_buy>=amt);
    if(state.list==="cx")arr=arr.filter(x=>isCeoCfo(rolesOf(x.f)));

      return `<div class="lrow f">${tk(x.c)}<span class="who"><b>${esc(x.c.name)}</b><span><i class="stag">${esc(SN(x.c.sector))}</i>${pBtn(o.name)}${o.roles?` · ${esc(o.roles)}`:""}</span><span>${md((x.f.tx_date||x.date).slice(0,10))}${hp!=null?` <i class="badge b-hold cb2">${holdTxt(t,hp)}</i>`:""}</span></span><span class="amt pos">${money(x.f.eff_buy,true)}</span></div>`})}

    m.addEventListener("click",e=>{if(e.target===m||e.target.closest("[data-close]"))m.hidden=true})}
  m.innerHTML=`<div class="sbox"><img src="${url}" alt="${esc(t.shareImg)}"><div class="sact"><a class="tgl strong" href="${url}" download="insider-flow-${S.date}.png">${t.shareSave}</a><button type="button" class="tgl" data-close>${t.shareClose}</button></div><div class="sub">${t.shareHint}</div></div>`;m.hidden=false}
app.addEventListener("click",e=>{if(e.target.closest("#sharebtn"))shareImage()});

/* ---------- weekly email: header button + modal, strip under key points ---------- */
const subHidden=()=>{try{return localStorage.getItem("sif-sub")==="1"}catch(e){return false}};
function subStrip(){if(subHidden())return "";const t=L();
  return `<div class="substrip" id="substrip"><span class="sstxt">✉️ ${esc(t.subStrip)}</span><form class="subform" action="https://buttondown.com/api/emails/embed-subscribe/april-insider-stock" method="post" target="_blank" rel="noopener"><input type="email" name="email" required autocomplete="email" placeholder="${esc(t.subPh)}" aria-label="${esc(t.subPh)}"><input type="hidden" name="embed" value="1"><button type="submit">${esc(t.subBtn)}</button></form><button type="button" class="subx" id="substripx" aria-label="${esc(t.subClose)}">×</button></div>`}
function openSub(){const m=$("submodal");m.hidden=false;setTimeout(()=>{try{$("sub-email").focus()}catch(e){}},50)}
document.addEventListener("click",e=>{
  if(e.target.closest("#subopen")){openSub();return}
  const m=$("submodal");if(!m.hidden&&(e.target===m||e.target.closest("#submodal [data-close]"))){m.hidden=true;return}
  if(e.target.closest("#substripx")){try{localStorage.setItem("sif-sub","1")}catch(_){}const st=$("substrip");if(st)st.remove()}});
document.addEventListener("submit",e=>{if(e.target.closest(".subform")){try{localStorage.setItem("sif-sub","1")}catch(_){}setTimeout(()=>{const st=$("substrip");if(st)st.remove();$("submodal").hidden=true},300)}});
addEventListener("keydown",e=>{if(e.key==="Escape"){const m=$("submodal");if(m&&!m.hidden)m.hidden=true}});
try{if(new URLSearchParams(location.search).has("sub"))setTimeout(openSub,400)}catch(e){}

/* ---------- 名词解释 popover ---------- */
document.addEventListener("click",e=>{const b=e.target.closest(".qm");let tip=$("tip");
  if(!b){if(tip&&!tip.hidden&&!e.target.closest("#tip"))tip.hidden=true;return}
  e.stopPropagation();e.preventDefault();
  if(!tip){tip=document.createElement("div");tip.id="tip";tip.className="tip";tip.setAttribute("role","note");document.body.appendChild(tip)}
  if(!tip.hidden&&tip.dataset.k===b.dataset.tip){tip.hidden=true;return}
  tip.dataset.k=b.dataset.tip;{const G=L().GL,k=b.dataset.tip;tip.innerHTML=k==="ctl"?(G.filed||"")+"<br><br>"+(G.scope||""):(G[k]||"")}tip.hidden=false;
  const r=b.getBoundingClientRect(),w=Math.min(330,innerWidth-24);tip.style.width=w+"px";
  tip.style.left=(Math.min(Math.max(12,r.left+r.width/2-w/2),innerWidth-w-12)+scrollX)+"px";tip.style.top=(r.bottom+8+scrollY)+"px"},true);
document.addEventListener("click",e=>{if(e.target.closest("#secclear")){state.sector=null;render();return}});
document.addEventListener("click",e=>{const a=e.target.closest("#opennotes");if(!a)return;e.preventDefault();const b=$("notes-box");b.open=true;b.scrollIntoView({behavior:"smooth",block:"start"})});
addEventListener("keydown",e=>{if(e.key==="Escape"){const tip=$("tip");if(tip)tip.hidden=true}
  if(e.key==="Enter"&&e.target.matches&&e.target.matches(".pn[data-person]")){e.preventDefault();openPerson(e.target.dataset.person)}});

/* ---------- search history (this browser only) ---------- */
let HIST=[];try{const v=JSON.parse(localStorage.getItem("sif-hist")||"[]");if(Array.isArray(v))HIST=v.filter(x=>typeof x==="string").slice(0,8)}catch(e){}
function saveHist(){try{localStorage.setItem("sif-hist",JSON.stringify(HIST))}catch(e){}}
function addHist(q){q=(q||"").trim();if(!q)return;HIST=[q,...HIST.filter(x=>x.toLowerCase()!==q.toLowerCase())].slice(0,8);saveHist()}
function histRow(t){if(!HIST.length)return"";
  return `<div class="hist"><span class="eyebrow">${esc(t.histT)}</span>${HIST.map(h=>`<button type="button" class="chip" data-hq="${esc(h)}" aria-pressed="${state.q&&state.q.toLowerCase()===h.toLowerCase()?"true":"false"}">${esc(h)}</button>`).join("")}<button type="button" class="linkbtn" id="histclr">${esc(t.histClr)}</button></div>`}

/* ---------- main render ---------- */
function render(){const t=L();renderStatic();requestAnimationFrame(updateCompact);
  if(state.err){app.innerHTML=`<div class="card empty">${t.loadErr(esc(state.err))}</div>`;return}
  if(!state.loaded)return;
  const days=state.days;if(!days.length){app.innerHTML=`<div class="card empty">${t.noData}</div>`;return}
  if(state.view==="search"){renderSearch();return}
  document.title=BASE_TITLE;
  if((state.win==="1m"||state.win==="3m")&&state.histState==="idle"){loadHistory();return}
  const src=H(),r=winRange(src),prev=prevRange(src,r);let body="";
  if(state.tab==="overview")body=`${hero(src,r,prev)}${summaryCard(src,r,prev)}${subStrip()}<div class="grid two">${topCard(src,r)}${clusterCard(src,r,3,true)}</div>`;
  else if(state.tab==="signals")body=`<div class="grid two">${listCard(src,r)}${clusterCard(src,r,12,false)}</div>`;
  else body=`<div class="grid two">${flowCard(r)}${rankCard(src,r,false)}</div>`;
  app.innerHTML=`<div class="grid">${controls(src,r)}${body}</div>`;
  renderHFilters(src,r);requestAnimationFrame(updateCompact);
  renderFlagged(src);
}

/* ---------- events ---------- */
function onCtlClick(e){
  const pb=e.target.closest("[data-person]");if(pb){openPerson(pb.dataset.person);return}
  const lc=e.target.closest("[data-list]");if(lc){state.list=lc.dataset.list;render();return}
  const ds=e.target.closest("[data-dstep]");if(ds){const all=MANIFEST.dates,i=all.indexOf(state.day||all[0]),j=Math.max(0,Math.min(all.length-1,i+ +ds.dataset.dstep));pickDay(all[j]);return}
  const b=e.target.closest("[data-tab],[data-win],[data-who],[data-day],[data-rank],[data-sec],[data-sector],[data-co],[data-gosec]");if(!b)return;
  if(b.dataset.co!==undefined){openCo(b.dataset.co);return}
  if(b.dataset.gosec){state.tab="sectors";state.sector=b.dataset.gosec;render();window.scrollTo({top:0,behavior:"smooth"});return}
  if(b.dataset.tab){state.tab=["overview","signals","sectors"].includes(b.dataset.tab)?b.dataset.tab:"overview";render();if(b.classList.contains("more"))window.scrollTo({top:0,behavior:"smooth"});return}
  if(b.dataset.win){state.win=b.dataset.win;state.dayIdx=0;state.day=null;try{localStorage.setItem("sif-win",state.win)}catch(e){}}
  else if(b.dataset.who){state.who=b.dataset.who;try{localStorage.setItem("sif-who",state.who)}catch(e){}}
  else if(b.dataset.day!==undefined)state.dayIdx=+b.dataset.day;
  else if(b.dataset.rank)state.rank=b.dataset.rank;
  else if(b.dataset.sec!==undefined)state.sector=b.dataset.sec||null;
  else if(b.dataset.sector){state.sector=state.sector===b.dataset.sector?null:b.dataset.sector;render();if(state.sector)document.getElementById("rank")?.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});return}
  render()}
app.addEventListener("click",onCtlClick);$("hfilters").addEventListener("click",onCtlClick);
$("hfilters").addEventListener("change",e=>{if(e.target.id==="hdaysel")pickDay(e.target.value);
  else if(e.target.id==="hwhosel"){state.who=e.target.value;try{localStorage.setItem("sif-who",state.who)}catch(_){}render()}});
$("totop").onclick=()=>window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
// single-day picker: older dates need the full history (the page starts with the latest 30 filing dates)
function pickDay(d){state.day=d;const loaded=state.days.map(x=>x.date),need=loaded.length<20||d<loaded[Math.min(loaded.length-1,10)];
  if(need&&state.histState==="idle"){loadHistory();return}render()}
app.addEventListener("change",e=>{if(e.target.id==="whosel"){state.who=e.target.value;try{localStorage.setItem("sif-who",state.who)}catch(_){}render();return}
  if(e.target.id==="daysel")pickDay(e.target.value);
  else if(e.target.id==="rolesel"){state.role=e.target.value;render()}
  else if(e.target.id==="secsel"){state.sector=e.target.value||null;render()}
  else if(e.target.id==="amtsel"){state.minAmt=+e.target.value;render()}});
srch.addEventListener("click",e=>{const pb=e.target.closest("[data-person]");if(pb){openPerson(pb.dataset.person);return}
  const b=e.target.closest("[data-co],[data-srange]");if(!b)return;
  if(b.dataset.co!==undefined)openCo(b.dataset.co);else{state.srange=b.dataset.srange;render()}});
srch.addEventListener("submit",e=>{if(e.target.id!=="sform")return;e.preventDefault();state.q=$("q").value.trim();state.co=null;state.person=null;addHist(state.q);go(state.q);$("q").blur();render()});
srch.addEventListener("input",e=>{if(e.target.id==="q")$("qwrap").classList.toggle("has-q",!!e.target.value)});
srch.addEventListener("click",e=>{
  if(e.target.closest("#charttgl")){chartOpen=!chartOpen;try{localStorage.setItem("sif-chart",chartOpen?"1":"0")}catch(e){}render();return}
  const cpp=e.target.closest("#copyperson");if(cpp){const u=location.origin+location.pathname+"#p="+encodeURIComponent(cpp.dataset.p),t=L();
    const ok=()=>{cpp.textContent=t.copied;setTimeout(()=>{cpp.textContent=L().copyLink},1800)};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(u).then(ok,()=>prompt(t.copyLink,u));else prompt(t.copyLink,u);return}
  const cp=e.target.closest("#copylink");if(cp){const u=location.origin+location.pathname+"#t="+encodeURIComponent(cp.dataset.q),t=L();
    const ok=()=>{cp.textContent=t.copied;setTimeout(()=>{cp.textContent=L().copyLink},1800)};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(u).then(ok,()=>prompt(t.copyLink,u));else prompt(t.copyLink,u);return}
  if(e.target.closest("#qclear")){state.q="";state.co=null;state.person=null;try{history.replaceState(null,"","#search")}catch(e){}render();const q=$("q");q.value="";q.focus();return}
  const h=e.target.closest("[data-hq]");if(h){state.q=h.dataset.hq;state.co=null;state.person=null;addHist(state.q);go(state.q);render();$("q").blur();return}
  if(e.target.closest("#histclr")){HIST=[];saveHist();render()}});
function openCo(k){state.co=k;state.person=null;state.view="search";const c=companyIndex().find(x=>x.key===k);state.q=c?(c.ticker||c.name):"";addHist(state.q);go(state.q);render();window.scrollTo({top:0})}
const setView=v=>{state.view=v;compactOn=false;$("top").classList.remove("compact");try{history.replaceState(null,"",v==="search"?"#search":"#sectors")}catch(e){}render();window.scrollTo({top:0})};
$("view-sectors").onclick=()=>setView("sectors");$("view-search").onclick=()=>setView("search");
["eff","od","all"].forEach(k=>$("who-"+k).onclick=()=>{state.who=k;try{localStorage.setItem("sif-who",k)}catch(e){}render()});
const setLang=l=>{lang=l;try{localStorage.setItem("sif-lang",l)}catch(e){}if(window.FORCE_LANG){window.FORCE_LANG=l;try{history.replaceState(null,"","/"+l+"/"+location.hash)}catch(e){}}render()};
LANGS.forEach(k=>$("lang-"+k).onclick=()=>setLang(k));
addEventListener("popstate",()=>{readHash();render();window.scrollTo({top:0})});
addEventListener("scroll",()=>{$("top").classList.toggle("scrolled",scrollY>4);updateCompact()},{passive:true});

renderStatic();
(async()=>{try{const r=await fetch("/data/manifest.json",{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);
  MANIFEST=await r.json();MANIFEST.dates=(MANIFEST.dates||[]).slice().sort().reverse();
  state.days=await fetchDays(MANIFEST.dates.slice(0,30));state.loaded=true;render()}catch(e){state.err=String(e&&e.message||"error");render()}})();
})();
</script>

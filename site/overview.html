:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f5f7fa; --ink:#0e1726; --muted:#5d6879; --faint:#7d8798; --line:#e1e6ed;
  --buy:#0f9d6e; --sell:#e0483f; --accent:#2c49c9; --hero:#0f1b2d; --hero-ink:#eef2f8; --hero-muted:#9fb0c8;
  --shadow:0 1px 2px rgba(14,23,38,.05),0 6px 20px rgba(14,23,38,.06);
  --display:"Bricolage Grotesque","Figtree","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --body:"Figtree","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b111b; --surface:#131c2a; --surface-2:#1a2535; --ink:#e8edf4; --muted:#9aa6b8; --faint:#7a869a; --line:#243146;
  --buy:#34d399; --sell:#ff7b72; --accent:#8ea6ff; --hero:#16243a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;gap:12px;padding-block:14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;color:var(--ink);text-decoration:none}
.logo{width:30px;height:30px;border-radius:9px;background:var(--hero);display:grid;place-items:center;flex:none}
.brand b{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.01em;white-space:nowrap}
.brand b i{font-style:normal;color:var(--accent)}
.lang{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;flex:none}
.lang button{border:0;background:none;padding:5px 10px;border-radius:999px;font-size:13px;color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* hero: the one bold moment — a dark plate with the three views stacked like map layers */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:24px;padding:clamp(26px,5vw,52px);margin:8px 0 40px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:36px;align-items:center}
html[lang^=zh] .hero h1{word-break:keep-all}
.hero h1{font:700 clamp(30px,5vw,50px)/1.08 var(--display);letter-spacing:-.02em;margin:0 0 16px;text-wrap:balance}
.hero .lead{font-size:clamp(16px,1.9vw,18px);color:var(--hero-muted);margin:0 0 26px;max-width:46ch}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:700;font-size:15px;padding:12px 18px;border-radius:12px;border:0;cursor:pointer;background:var(--ink);color:var(--bg)}
.hero .btn{background:#fff;color:#0e1726}
.hero .btn.ghost{background:transparent;color:var(--hero-ink);box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}
.layers{display:grid;gap:10px}
.layers a{display:grid;grid-template-columns:40px minmax(0,1fr);gap:4px 14px;align-items:center;text-decoration:none;color:var(--hero-ink);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:14px 16px;transition:background .15s,transform .15s}
.layers a:hover{background:rgba(255,255,255,.11)}
.layers a:nth-child(2){margin-left:14px}.layers a:nth-child(3){margin-left:28px}
.layers .ic{grid-row:span 2;width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.08);display:grid;place-items:center}
.layers b{font-size:15.5px}
.layers span{font-size:13.5px;color:var(--hero-muted);line-height:1.45}

section{margin:0 0 48px}
h2{font:700 clamp(24px,3vw,30px)/1.2 var(--display);letter-spacing:-.015em;margin:0 0 16px}
.intro{color:var(--muted);max-width:62ch;margin:-6px 0 20px}

.chainwhy{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.cake{display:grid;grid-template-columns:minmax(0,1fr) 30px;gap:10px}
.tiers{display:grid;gap:6px}
.tier{display:grid;gap:2px;padding:12px 14px;border-radius:12px;background:oklch(.95 .035 var(--h));border:1px solid oklch(.86 .06 var(--h))}
.tier b{display:flex;align-items:center;gap:8px;font-size:15.5px;color:oklch(.34 .09 var(--h))}
.tier b span{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:oklch(.42 .1 var(--h));color:#fff;flex:none}
.tier>span{font-size:13.5px;color:var(--muted);line-height:1.45;padding-left:30px}
.tier.cap{--h:150;margin-top:6px;border-style:dashed}
@media (prefers-color-scheme:dark){.tier{background:oklch(.27 .04 var(--h));border-color:oklch(.37 .05 var(--h))}.tier b{color:oklch(.88 .06 var(--h))}.tier b span{background:oklch(.7 .1 var(--h));color:#0b111b}}
.flow{position:relative;display:grid;justify-items:center}
.flow i{position:absolute;top:8px;bottom:70px;width:2px;background:linear-gradient(var(--line),var(--accent))}
.flow i::after{content:"";position:absolute;bottom:-2px;left:-5px;border:6px solid transparent;border-top:8px solid var(--accent)}
.flow em{position:absolute;bottom:0;writing-mode:vertical-rl;font-style:normal;font-size:12.5px;font-weight:700;color:var(--accent);letter-spacing:.06em}
.why{display:grid;gap:10px}
.why div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.why b{display:block;font-size:16px;margin-bottom:4px}
.why p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.6}
.prod .name .n{width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:13px}
.so{margin:16px 0 0;padding-left:14px;border-left:3px solid var(--accent);max-width:68ch}

.prod{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:28px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:clamp(20px,3.4vw,32px);margin-bottom:14px;box-shadow:var(--shadow)}
.prod .name{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;color:var(--muted);margin:0 0 10px}
.prod .name i{width:30px;height:30px;border-radius:9px;background:var(--hero);display:grid;place-items:center;color:#fff}
.prod .q{font:700 clamp(21px,2.6vw,26px)/1.25 var(--display);letter-spacing:-.01em;margin:0 0 16px;text-wrap:balance}
.prod .what{margin:0 0 14px}
.prod h3{font-size:14px;font-weight:700;margin:18px 0 8px}
.prod ul{margin:0;padding-left:20px}
.prod li{margin:0 0 6px}
.prod li::marker{color:var(--accent)}
.tip{margin:16px 0 0;font-size:14.5px;color:var(--muted);background:var(--surface-2);border-radius:12px;padding:12px 14px}
.tip b{color:var(--ink)}
.prod .btn{margin-top:18px}
.cover{font-size:14px;color:var(--muted);margin:14px 0 0}

ol.steps{list-style:none;counter-reset:s;padding:0;margin:0;display:grid;gap:12px;max-width:760px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:36px minmax(0,1fr);gap:14px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
ol.steps li::before{content:counter(s);width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:15px}
.after{color:var(--muted);margin:14px 0 0;max-width:68ch}

.mail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
.mail p{margin:0 0 14px}
.fine{font-size:14px;color:var(--muted)}
.letter{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.letter .hd{padding:14px 18px;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--muted);display:grid;gap:2px}
.letter .hd b{color:var(--ink);font-size:15px}
.letter ul{list-style:none;margin:0;padding:8px 18px 14px}
.letter li{padding:10px 0;border-bottom:1px dashed var(--line);display:grid;gap:2px}
.letter li:last-child{border-bottom:0}
.letter li b{font-size:14.5px}
.letter li span{font-size:13.5px;color:var(--muted);line-height:1.5}

.data ul{margin:0;padding-left:20px;max-width:72ch}
.data li{margin:0 0 8px;color:var(--muted)}
footer{padding:24px 0 48px;color:var(--faint);font-size:13px;border-top:1px solid var(--line)}

@media (max-width:640px){.lang .l2{display:none}}
@media (max-width:380px){.brand b{font-size:16.5px}}
@media (max-width:820px){
  .hero{grid-template-columns:1fr;gap:26px}
  .layers a:nth-child(2),.layers a:nth-child(3){margin-left:0}
  .chainwhy{grid-template-columns:1fr}
  .prod{grid-template-columns:1fr;gap:4px}
  .mail{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  const ORDER=["chain","earn","ins"];
  const layer=k=>`<a href="${HREF[k]}"><span class="ic">${ICO[k]}</span><b>${esc(s.layers[k][0])}</b><span>${esc(s.layers[k][1])}</span></a>`;
  const prod=(k,i)=>{const p=s.prods[k];
    return `<article class="prod" id="${k}"><div><p class="name"><span class="n">${i+1}</span><i>${ICO[k]}</i>${esc(s.layers[k][0])}</p><h3 class="q">${esc(p.q)}</h3></div>
      <div><p class="what">${esc(p.what)}</p><h3>${esc(s.usesH)}</h3><ul>${p.uses.map(u=>`<li>${esc(u)}</li>`).join("")}</ul>
      <p class="tip">${p.tip}</p>${p.cover&&COVER?`<p class="cover">${esc(p.cover(COVER.join(lang==="en"?", ":"、")))}</p>`:""}
      <a class="btn" href="${HREF[k]}">${esc(p.btn)}</a></div></article>`};
  const H=[325,285,250,205,75];
  const stack=`<div class="cake" role="img" aria-label="${esc(s.chainH)}"><div class="tiers">${s.stack.map((l,i)=>`<div class="tier" style="--h:${H[i]}"><b><span>${5-i}</span>${esc(l[0])}</b><span>${esc(l[1])}</span></div>`).join("")}
      <div class="tier cap"><b><span>$</span>${esc(s.capital[0])}</b><span>${esc(s.capital[1])}</span></div></div>
      <div class="flow" aria-hidden="true"><i></i><em>${esc(s.flowLbl)}</em></div></div>`;
  $("main").innerHTML=`
  <div class="hero"><div><h1>${esc(s.h1)}</h1><p class="lead">${esc(s.lead)}</p>
    <div class="cta"><a class="btn" href="/">${esc(s.ctaStart)}</a><button type="button" class="btn ghost" data-sub>${esc(s.ctaSub)}</button></div></div>
    <nav class="layers" aria-label="${esc(s.prodH)}">${ORDER.map(layer).join("")}</nav></div>
  <section><h2>${esc(s.chainH)}</h2><p class="intro">${esc(s.chainIntro)}</p>
    <div class="chainwhy">${stack}<div class="why">${s.why.map(w=>`<div><b>${esc(w[0])}</b><p>${esc(w[1])}</p></div>`).join("")}</div></div></section>
  <section><h2>${esc(s.prodH)}</h2><p class="intro">${esc(s.prodIntro)}</p>${ORDER.map(prod).join("")}</section>
  <section><h2>${esc(s.flowH)}</h2><p class="intro">${esc(s.flowIntro)}</p><ol class="steps">${s.flow.map(f=>`<li><span>${esc(f)}</span></li>`).join("")}</ol><p class="after">${esc(s.flowAfter)}</p></section>
  <section class="mail" id="subscribe"><div><h2>${esc(s.mailH)}</h2><p>${esc(s.mailP)}</p><p class="fine">${esc(s.mailP2)}</p><button type="button" class="btn" data-sub>${esc(s.mailBtn)}</button></div>
    <div class="letter" aria-hidden="true"><div class="hd"><span>${esc(s.letterFrom)}</span><b>${esc(s.letterSubj)}</b></div>
      <ul>${s.letter.map(l=>`<li><b>${esc(l[0])}</b><span>${esc(l[1])}</span></li>`).join("")}<li><span>${esc(s.letterFoot)}</span></li></ul></div></section>
  <section class="data"><h2>${esc(s.dataH)}</h2><ul>${s.data.map(d=>`<li>${esc(d)}</li>`).join("")}</ul></section>`;
  $("foot").textContent=s.foot;
}
document.addEventListener("click",e=>{
  if(e.target.closest&&e.target.closest("[data-sub]")){const b=document.getElementById("aps-open");if(b)b.click();else location.href="/insider/?sub=1"}
});
LANGS.forEach(k=>$("lang-"+k).addEventListener("click",()=>{lang=k;try{localStorage.setItem("sif-lang",k)}catch(e){}render()}));
render();
fetch("/earnings/data/index.json").then(r=>r.ok?r.json():null).then(j=>{
  if(j&&j.companies&&j.companies.length){COVER=j.companies.map(c=>c.t);render()}}).catch(()=>{});
</script>
</body>
</html>

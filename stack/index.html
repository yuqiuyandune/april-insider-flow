:root{

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;gap:12px;padding-block:14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;color:var(--ink);text-decoration:none}
.logo{width:30px;height:30px;border-radius:9px;background:var(--hero);display:grid;place-items:center;flex:none}
.brand b{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.01em;white-space:nowrap}
.brand b i{font-style:normal;color:var(--accent)}
.lang{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;flex:none}
.lang button{border:0;background:none;padding:5px 10px;border-radius:999px;font-size:13px;color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

h1{font:700 clamp(24px,3.4vw,30px)/1.12 var(--display);letter-spacing:-.015em;margin:8px 0 6px}
.themes{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.themes a{font-size:13.5px;font-weight:600;text-decoration:none;color:var(--muted);padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.themes a:hover{color:var(--ink);border-color:var(--faint)}
.themes a[aria-current=page]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.themes a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.deck{max-width:70ch;color:var(--muted);margin:0 0 4px;font-size:14.5px}
.asof{font-size:13px;color:var(--faint);margin:0}

.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:22px 0 12px}
.search{flex:1 1 260px;max-width:380px}
.search input{width:100%;height:40px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 16px}
.search input::placeholder{color:var(--faint)}
.filter{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.filter button{border:0;background:none;padding:6px 14px;border-radius:999px;font-size:13.5px;color:var(--muted);cursor:pointer}
.filter button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.legend{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:12.5px;color:var(--muted);margin:0 0 16px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend .sw{width:22px;height:14px;border-radius:5px;border:1px solid var(--faint);background:var(--surface)}
.legend .sw.hot{border-style:dashed;background:transparent}

.band[data-layer="0"]{margin-top:14px;border-style:dashed}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}

.tint{--bg-t:oklch(var(--lb) var(--cb) var(--h));--rail-t:oklch(var(--lr) var(--cr) var(--h));--bd-t:oklch(var(--ld) var(--cd) var(--h));--ink-t:oklch(var(--li) var(--ci) var(--h))}
.stack{display:flex;flex-direction:column;gap:6px;min-height:320px}
.ltabs{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin:4px 0 16px;-webkit-overflow-scrolling:touch}
.ltabs::-webkit-scrollbar{display:none}
.ltabs button{flex:none;border:0;background:none;cursor:pointer;font:600 15.5px/1.2 var(--body);color:var(--muted);padding:8px 2px 11px;border-bottom:3px solid transparent;margin-bottom:-1px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.ltabs button i{width:9px;height:9px;border-radius:3px;background:oklch(.62 .12 var(--h));flex:none}
.ltabs button small{font-size:12px;font-weight:500;color:var(--faint)}
.ltabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.ltabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
@media (max-width:640px){
  .ltabs{flex-wrap:wrap;gap:6px;overflow:visible;border-bottom:0;margin:4px 0 14px}
  .ltabs button{padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);margin:0;font-size:13.5px;color:var(--ink);gap:5px}
  .ltabs button i{width:7px;height:7px}
  .ltabs button small{display:none}
  .ltabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
}
.band.compact .chip .nm{display:none}
.band.compact .rail{padding:12px 16px;gap:4px}
.band.compact .rail p{display:none}
.band.compact .rail h2{font-size:20px}
.band.compact .chip{height:28px;padding:0 8px}
.band.compact .seg{padding:7px 0}
.open{align-self:flex-start;margin-top:4px;border:1px solid var(--bd-t);background:var(--surface);color:var(--ink-t);font:600 12.5px/1 var(--body);padding:7px 10px;border-radius:999px;cursor:pointer}
.open:hover{border-color:var(--ink-t)}
button.tag{cursor:pointer;font:inherit;font-size:12.5px}
.band{display:grid;grid-template-columns:188px minmax(0,1fr);background:var(--bg-t);border:1px solid var(--bd-t);border-radius:8px;overflow:hidden}
.band:first-child{border-radius:24px 24px 8px 8px}
.band:last-child{border-radius:8px 8px 24px 24px}
.band.touch{box-shadow:inset 0 0 0 2px var(--ink-t)}
.rail{background:var(--rail-t);padding:16px;display:flex;flex-direction:column;gap:6px;color:var(--ink-t)}
.num{width:24px;height:24px;border-radius:50%;background:var(--ink-t);color:var(--bg-t);display:grid;place-items:center;font:700 13px/1 var(--display)}
.rail h2{font:700 22px/1.15 var(--display);margin:4px 0 0;letter-spacing:-.01em;overflow-wrap:anywhere}
.rail p{margin:0;font-size:12.5px;line-height:1.45;color:var(--muted)}
.mood{margin-top:auto;padding-top:10px;display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12.5px;color:var(--ink-t)}
.mood .lbl{flex-basis:100%}
.mood .m{display:inline-flex;align-items:center;gap:5px}
.segs{padding:4px 16px}
.seg{display:grid;grid-template-columns:128px minmax(0,1fr);gap:6px 14px;padding:11px 0;border-top:1px solid var(--bd-t)}
.seg:first-child{border-top:0}
.seg h3{font:600 12.5px/1.4 var(--body);color:var(--muted);margin:7px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;transition:opacity .15s,border-color .15s}
.chip b{font-weight:700;font-size:13.5px;letter-spacing:.01em}
.chip .nm{font-size:12.5px;color:var(--muted);max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.hot{border-style:dashed;border-color:var(--faint);background:transparent}
.chip:hover{border-color:var(--ink-t)}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);background:var(--surface)}
.chip.dim{opacity:.2}
.mk{width:9px;height:9px;flex:none}
.mk.up{fill:var(--buy)} .mk.down{fill:var(--sell)}
.nodata{padding:40px 16px;color:var(--muted)}

.panel{position:sticky;top:14px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 18px 16px}
.panel .close{display:none;position:absolute;top:8px;right:8px;width:34px;height:34px;border:0;border-radius:50%;background:var(--surface-2);cursor:pointer;font-size:20px;line-height:1;color:var(--muted)}
.crumb{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.crumb i{width:10px;height:10px;border-radius:50%;background:oklch(.64 .12 var(--h))}
.panel h2{font:700 24px/1.15 var(--display);margin:0 0 8px;letter-spacing:-.01em;padding-right:30px}
.panel h2 .tk{margin-right:8px}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid var(--faint);color:var(--muted);vertical-align:3px;margin-left:2px}
.badge.core{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.badge.hot{border-style:dashed}
.reason{margin:10px 0 14px;font-size:14.5px;line-height:1.6}
.row{margin:0 0 14px}
.row h4{font:600 12.5px/1.3 var(--body);color:var(--muted);margin:0 0 6px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12.5px;padding:2px 10px;border-radius:999px;background:var(--bg-t);border:1px solid var(--bd-t);color:var(--ink-t)}
.figs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fig{background:var(--surface-2);border-radius:12px;padding:9px 12px}
.fig span{display:block;font-size:12px;color:var(--muted)}
.fig b{font:700 18px/1.3 var(--display)}
.fig.b b{color:var(--buy)} .fig.s b{color:var(--sell)}
.fig.z b{color:var(--faint)}
.row .note{margin:8px 0 0;font-size:13px;color:var(--muted)}
.row p.msg{margin:0;font-size:14px;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:8px}
a.xlink{display:inline-block;text-decoration:none;font-weight:600;color:var(--accent);background:var(--surface-2);border-color:var(--line)}
.btn.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line);padding:9px 15px}
.btn{display:inline-block;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:600;font-size:14px;padding:10px 16px;border-radius:12px}
.fine{margin:12px 0 0;font-size:12px;color:var(--faint)}
.empty h2{font-size:20px}
.empty p{color:var(--muted);margin:0}

.notes{margin:30px 0 0;padding:18px 20px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.notes p{margin:0 0 10px;font-size:13.5px;color:var(--muted);max-width:78ch}
.notes p:last-child{margin:0}
.notes b{color:var(--ink)}
footer{padding:20px 0 44px;font-size:12.5px;color:var(--faint)}

@media (prefers-reduced-motion:no-preference){
  .intro .band{animation:rise .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i) * 120ms)}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}}
}

@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .panel{position:fixed;left:8px;right:8px;bottom:8px;top:auto;max-height:74vh;overflow:auto;z-index:30;box-shadow:0 10px 40px rgba(0,0,0,.28);transform:translateY(calc(100% + 24px));visibility:hidden}
  .panel.open{transform:none;visibility:visible}
  .panel .close{display:block}
  @media (prefers-reduced-motion:no-preference){.panel{transition:transform .24s ease,visibility 0s .24s}.panel.open{transition:transform .24s ease}}
}
@media (max-width:640px){
  .band{grid-template-columns:1fr}
  .rail{flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:12px 16px}
  .rail h2{margin:0;font-size:20px}
  .rail p{flex-basis:100%;order:5}
  .mood{margin:0 0 0 auto;padding:0}
  .mood .lbl{flex-basis:auto}
  .seg{grid-template-columns:1fr;gap:6px}
  .seg h3{margin:0}
  .segs{padding:2px 14px}
  .brand b{font-size:16px}
  .lang .l2{display:none}
}
</style>

const LANGS=["en","zh","tw"],LOC={en:"en",zh:"zh-CN",tw:"zh-TW"};
function detectLang(){const ls=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||"en"]).map(x=>String(x).toLowerCase());
  for(const l of ls){if(l.startsWith("zh"))return /hant|-tw|-hk|-mo/.test(l)?"tw":"zh";if(l.startsWith("en"))return "en"}return "en"}
let lang=detectLang();
try{const v=localStorage.getItem("sif-lang");if(LANGS.includes(v))lang=v}catch(e){}
try{const q=new URLSearchParams(location.search).get("lang");if(LANGS.includes(q))lang=q}catch(e){}

let D=null,ftype="all",query="",sel=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const t=()=>Object.assign({},T[lang],XT[lang],THEME==="energy"?TE[lang]:{});
const nm=c=>c.name[lang]||c.name.zh;
const money=v=>{const a=Math.abs(v);return a>=1e9?`$${(a/1e9).toFixed(2)}B`:a>=1e6?`$${(a/1e6).toFixed(1)}M`:a>=1e3?`$${Math.round(a/1e3)}K`:`$${Math.round(a)}`};
const fmtDate=iso=>lang==="en"?new Date(iso+"T12:00:00Z").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric",timeZone:"UTC"}):`${+iso.slice(0,4)}年${+iso.slice(5,7)}月${+iso.slice(8)}日`;
const fmtShort=iso=>lang==="en"?new Date(iso+"T12:00:00Z").toLocaleDateString("en-US",{month:"short",day:"numeric",timeZone:"UTC"}):`${+iso.slice(5,7)}月${+iso.slice(8)}日`;
const SVG={up:'<path d="M5 1.5 9 8.5H1z"/>',down:'<path d="M5 8.5 1 1.5h8z"/>'};
const mkSvg=k=>`<svg class="mk ${k}" viewBox="0 0 10 10" aria-hidden="true">${SVG[k]}</svg>`;
const mark=c=>{const i=c.ins;if(!i.filed)return null;return i.buy>i.sell?"up":i.sell>i.buy?"down":null};
const layerOf=c=>D.segments.find(s=>s.id===c.seg).layer;
const byId=(arr,id)=>arr.find(x=>x.id===id);
const visible=c=>ftype==="all"||c.type==="core";
const matches=c=>!query||c.t.toLowerCase().startsWith(query)||Object.values(c.name).some(n=>String(n).toLowerCase().includes(query));

function chipHtml(c){const m=mark(c);
  return `<button type="button" class="chip ${c.type}" data-t="${esc(c.t)}" aria-pressed="${sel===c.t}"><b>${esc(c.t)}</b><span class="nm" title="${esc(nm(c))}">${esc(nm(c))}</span>${m?mkSvg(m)+`<span class="sr">${esc(t()["m_"+m])}</span>`:""}</button>`}

let tab="all";
const layersSorted=()=>[...D.layers].sort((a,b)=>b.id-a.id);
function renderTabs(){
  const cs=D.companies.filter(visible);
  const b=(id,label,h,n)=>`<button type="button" role="tab" data-tab="${id}" aria-selected="${tab===id}"${h!=null?` style="--h:${h}"`:""}>${h!=null?"<i></i>":""}${esc(label)}${n!=null?`<small>${n}</small>`:""}</button>`;
  $("ltabs").innerHTML=b("all",t().tabAll,null,null)+layersSorted().map(L=>b(String(L.id),L.name[lang],L.hue,cs.filter(c=>layerOf(c)===L.id).length)).join("");
}
function setTab(id,keepHash){
  tab=id;renderTabs();renderStack();
  if(!keepHash&&!sel){try{history.replaceState(null,"",id==="all"?location.pathname+location.search:"#layer-"+id)}catch(e){}}

}
function renderStack(){
  const cs=D.companies.filter(visible),compact=tab==="all";
  const layers=compact?layersSorted():D.layers.filter(L=>String(L.id)===tab);
  $("stack").innerHTML=layers.map(L=>{
    const ls=cs.filter(c=>layerOf(c)===L.id);
    const up=ls.filter(c=>mark(c)==="up").length,dn=ls.filter(c=>mark(c)==="down").length;
    const segs=D.segments.filter(s=>s.layer===L.id).map(s=>{
      const sc=ls.filter(c=>c.seg===s.id);
      return sc.length?`<div class="seg"><h3>${esc(s.name[lang])}</h3><div class="chips">${sc.map(chipHtml).join("")}</div></div>`:""}).join("");

        <div class="mood"><span class="lbl">${esc(t().mood)}</span><span class="m" role="img" aria-label="${esc(t().m_up+": "+t().unit(up))}">${mkSvg("up")}${esc(t().unit(up))}</span><span class="m" role="img" aria-label="${esc(t().m_down+": "+t().unit(dn))}">${mkSvg("down")}${esc(t().unit(dn))}</span></div>
        ${compact?`<button type="button" class="open" data-goto="${L.id}">${esc(t().openLayer)} · ${esc(t().nCo(ls.length))}</button>`:""}</header>
      <div class="segs">${segs}</div></section>`}).join("");
  applyDim();touchLayers();
}
function applyDim(){document.querySelectorAll("#stack .chip").forEach(el=>{const c=D.companies.find(x=>x.t===el.dataset.t);el.classList.toggle("dim",!!query&&!matches(c))})}
function touchLayers(){const c=sel&&D.companies.find(x=>x.t===sel);const ids=c?c.also:[];
  document.querySelectorAll("#stack .band").forEach(b=>b.classList.toggle("touch",ids.includes(+b.dataset.layer)))}

let EARN=null;const earnHas=t=>!!EARN&&EARN.has(t);
function renderPanel(){
  const p=$("panel"),c=sel&&D.companies.find(x=>x.t===sel),s=t();
  p.classList.toggle("open",!!c);
  const closeBtn=`<button type="button" class="close" id="close" aria-label="${esc(s.close)}">×</button>`;

  if(i.filed&&(i.buy||i.sell)){
    insHtml=`<div class="figs"><div class="fig b${i.buy?"":" z"}"><span>${esc(s.buy)}</span><b>${i.buy?money(i.buy):"–"}</b></div><div class="fig s${i.sell?"":" z"}"><span>${esc(s.sell)}</span><b>${i.sell?money(i.sell):"–"}</b></div></div><p class="note">${esc(s.days(i.filed))}</p>`}
  else if(i.filed){insHtml=`<p class="msg">${esc(s.onlyExcl)}</p>`}
  else if(c.seen){insHtml=`<p class="msg">${esc(s.noWin)}</p>`}
  else if(!c.listed){insHtml=`<p class="msg">${esc(s.notListed)}</p>`}
  else{insHtml=`<p class="msg">${esc(s.noRec(fmtShort(D.first)))}</p>`}
  const href=c.page?(lang==="tw"?`/tw/s/${encodeURIComponent(c.page)}.html`:`/s/${encodeURIComponent(c.page)}.html`):null;
  p.innerHTML=`${closeBtn}
    <div class="crumb tint" style="--h:${L.hue}"><i></i>${esc(L.name[lang])} / ${esc(seg.name[lang])}</div>
    <h2><span class="tk">${esc(c.t)}</span>${esc(nm(c))} <span class="badge ${c.type}">${esc(c.type==="core"?s.core:s.hot)}</span></h2>
    <p class="reason">${esc(c.reason[lang]||c.reason.zh)}</p>
    ${also?`<div class="row"><h4>${esc(s.also)}</h4><div class="tags">${also}</div></div>`:""}
    ${c.cross?`<div class="row"><a class="tag xlink" href="${c.cross==="stack"?"/themes/ai/":"/themes/energy/"}#${encodeURIComponent(c.t)}">${esc(s.cross(c.cross))} →</a></div>`:""}
    <div class="row"><h4>${esc(s.ins)}</h4>${insHtml}</div>
    ${href||earnHas(c.t)?`<div class="links">${href?`<a class="btn" href="${href}">${esc(s.details)}</a>`:""}${earnHas(c.t)?`<a class="btn alt" href="/earnings/#${encodeURIComponent(c.t)}">${esc(s.earn)}</a>`:""}</div>`:""}
    <p class="fine">${esc(s.fine)}</p>`;

function select(tk,scroll){
  sel=tk||null;
  if(sel&&tab!=="all"){const c=D.companies.find(x=>x.t===sel);if(c&&String(layerOf(c))!==tab){tab=String(layerOf(c));renderTabs();renderStack()}}
  document.querySelectorAll("#stack .chip").forEach(el=>el.setAttribute("aria-pressed",String(el.dataset.t===sel)));
  renderPanel();touchLayers();
  try{history.replaceState(null,"",sel?"#"+encodeURIComponent(sel):(tab==="all"?location.pathname+location.search:"#layer-"+tab))}catch(e){}
  if(scroll&&sel){const el=document.querySelector(`#stack .chip[data-t="${CSS.escape(sel)}"]`);if(el)el.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"})}
}

function renderStatic(){
  const s=t();document.documentElement.lang=LOC[lang];
  document.title=`${s.title} · April's Stock Atlas`;
  $("title").textContent=s.title;$("deck").textContent=s.deck;
  $("themes").innerHTML=THEMES.map(([k,h])=>`<a href="${h}"${k===THEME?' aria-current="page"':""}>${esc(TNAME[lang][k])}</a>`).join("");
  $("q").placeholder=s.search;$("q-l").textContent=s.search;
  LANGS.forEach(k=>$("lang-"+k).setAttribute("aria-pressed",String(lang===k)));
  $("notes").innerHTML=s.notes.map(x=>`<p>${x}</p>`).join("");
  if(!D)return;
  $("asof").textContent=s.asof(fmtDate(D.asof),fmtDate(D.window.from),fmtDate(D.window.to));
  const nAll=D.companies.length,nCore=D.companies.filter(c=>c.type==="core").length;
  const fb=document.querySelectorAll("#filter button");fb[0].textContent=s.fAll(nAll);fb[1].textContent=s.fCore(nCore);
  fb.forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.f===ftype)));
  $("legend").innerHTML=`<span><i class="sw"></i>${esc(s.lCore)}</span><span><i class="sw hot"></i>${esc(s.lHot)}</span>`+
    ["up","down"].map(k=>`<span>${mkSvg(k)}${esc(s["m_"+k])}</span>`).join("")+`<span>${esc(s.lNone)}</span>`;
}
function renderAll(){renderStatic();if(D){renderTabs();renderStack();renderPanel()}}

document.addEventListener("click",e=>{
  const chip=e.target.closest&&e.target.closest("#stack .chip");
  if(chip){select(chip.dataset.t===sel?null:chip.dataset.t);return}
  if(e.target.id==="close"){select(null);return}
  const tb=e.target.closest&&e.target.closest("#ltabs [data-tab]");if(tb){setTab(tb.dataset.tab);return}
  const go=e.target.closest&&e.target.closest("[data-goto]");if(go){setTab(String(go.dataset.goto));window.scrollTo({top:$("ltabs").getBoundingClientRect().top+scrollY-70,behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"});return}
});
$("ltabs").addEventListener("keydown",e=>{if(e.key!=="ArrowRight"&&e.key!=="ArrowLeft")return;const bs=[...$("ltabs").querySelectorAll("button")],i=bs.findIndex(b=>b.dataset.tab===tab),j=(i+(e.key==="ArrowRight"?1:-1)+bs.length)%bs.length;setTab(bs[j].dataset.tab);bs[j]&&$("ltabs").querySelectorAll("button")[j].focus()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sel)select(null)});
LANGS.forEach(k=>$("lang-"+k).addEventListener("click",()=>{lang=k;try{localStorage.setItem("sif-lang",k)}catch(e){}renderAll()}));
$("filter").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;ftype=b.dataset.f;
  if(sel&&ftype==="core"){const c=D.companies.find(x=>x.t===sel);if(c&&c.type!=="core")sel=null}
  renderStatic();renderTabs();renderStack();renderPanel()});
$("q").addEventListener("input",e=>{query=e.target.value.trim().toLowerCase();applyDim()});
$("q").addEventListener("keydown",e=>{if(e.key!=="Enter"||!query)return;
  const hit=D.companies.find(c=>visible(c)&&matches(c));if(hit){e.preventDefault();select(hit.t,true)}});

renderStatic();
fetch("/earnings/data/index.json").then(r=>r.ok?r.json():null).then(j=>{if(j&&j.companies){EARN=new Set(j.companies.map(c=>c.t));if(D)renderPanel()}}).catch(()=>{});
fetch(THEME==="energy"?"/themes/energy/data.json":"/themes/ai/data.json",{cache:"no-cache"}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(d=>{
  D=d;renderStatic();
  let h="";try{h=decodeURIComponent(location.hash.slice(1))}catch(e){}
  const hit=h&&D.companies.find(c=>c.t===h.toUpperCase()),lm=/^layer-(\d)$/.exec(h);
  if(hit)tab=String(layerOf(hit));else if(lm&&D.layers.some(L=>String(L.id)===lm[1]))tab=lm[1];
  renderTabs();renderStack();
  if(hit){if(hit.type==="hot"&&ftype==="core"){ftype="all";renderStatic();renderStack()}select(hit.t,true)}else renderPanel();
  setTimeout(()=>$("stack").classList.remove("intro"),1800);
}).catch(()=>{$("stack").innerHTML=`<div class="nodata">${esc(t().err)}</div>`});
</script>
</body>
</html>
